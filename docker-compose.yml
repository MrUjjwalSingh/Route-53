services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - db-data:/data
    environment:
      DATABASE_URL: sqlite:////data/route53.db
      SESSION_SECRET: dev-secret-change-me
      CORS_ORIGINS: http://localhost:3001
      ENVIRONMENT: development

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* vars are inlined at build time, so this must be a
        # build arg — setting it under `environment:` would have no effect.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  db-data:
